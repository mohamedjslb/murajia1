.mkg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mkg .btn.mk{min-height:44px;padding:0 16px;border-radius:22px;background:color-mix(in srgb,var(--t,var(--pri)) 13%,var(--card));color:var(--tx);border:1px solid color-mix(in srgb,var(--t,var(--pri)) 32%,transparent);font-weight:500}
.mkg .btn.mk:active{transform:scale(.96)}.mkg .btn.mk .ic{color:var(--t,var(--pri))}
.btn.pl2{min-height:42px;border-radius:21px;padding:0 16px;background:color-mix(in srgb,var(--pri) 13%,var(--card));color:var(--pri);font-weight:600}
.fch{font-size:15px}
.mtr{display:flex;align-items:center;gap:10px;padding:8px 0}.mtr+.mtr{border-top:1px solid var(--sec)}
.mtr .dot{width:12px;height:12px;margin:0;flex:none}
.mtr input{flex:1;min-height:42px}
/* ===== الستايل الزجاجي: إضاءة علوية بشكل شريط، ولون ثانٍ من أسفل اليمين، وحبيبات خفيفة ===== */
:root{--r:26px;--bl:16px}
body{position:relative}#app{position:relative;z-index:1}
#bgl{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
#bgl .gi{position:absolute;inset:0;--mk:#2E3B22;--mo:.02;overflow:hidden}
#bgl .gi svg{width:100%;height:100%;display:block}
#bgl .gi path{fill:var(--mk);fill-opacity:var(--mo);fill-rule:evenodd}
:root[data-theme=dark] #bgl .gi,:root[data-pal=ivory] #bgl .gi,:root[data-pal=silver] #bgl .gi{--mk:#fff;--mo:.009}
@media(prefers-color-scheme:dark){:root[data-theme=auto] #bgl .gi{--mk:#fff;--mo:.009}}
:root{--wt:.3}:root[data-theme=dark]{--wt:.126}@media(prefers-color-scheme:dark){:root[data-theme=auto]{--wt:.126}}
#bgl .gv{position:absolute;left:0;right:0;top:0;height:58%;background:radial-gradient(130% 38% at 50% 0,rgba(255,255,255,var(--wt)),transparent 75%),linear-gradient(to bottom,color-mix(in srgb,var(--glow) calc(52%*var(--bi)),transparent),color-mix(in srgb,var(--glow) calc(16%*var(--bi)),transparent) 45%,transparent)}
#bgl .gs{position:absolute;inset:0;background:radial-gradient(50% 26% at 100% 100%,color-mix(in srgb,var(--p2) calc(32%*var(--bi)),transparent),transparent 72%)}
.card,.sb,#nav,.hd,.hero,.dl,.fw.au{background:var(--gl);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl));border:1px solid var(--gb);box-shadow:0 3px 12px var(--sh),inset 0 1px 0 color-mix(in srgb,var(--pri) 30%,var(--hl))}
.card,.hero,.hd,.dl,.fw.au{border-radius:var(--r)}
#nav,.sb{border-radius:32px}
#nav,.hd{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hd{min-height:72px}.hd::before,.hd::after{display:none}
#s-home .hd{position:sticky;top:8px;z-index:6}
#s-lessons .sb{position:sticky;top:8px;z-index:6}
.hero{color:var(--tx)}.hero small{color:var(--mu);opacity:1}.hero h3{color:var(--tx)}
.hero .pl{width:48px;height:48px;border-radius:50%;background:var(--pri);color:var(--onpri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 12%,transparent),0 2px 10px color-mix(in srgb,var(--pri) 24%,transparent)}
.chip{background:var(--gl);border:1px solid var(--gb);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl))}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.in{background:color-mix(in srgb,var(--tx) 7%,transparent);border:1.5px solid color-mix(in srgb,var(--tx) 14%,transparent)}.in:focus{border-color:var(--pri)}
.seg{background:color-mix(in srgb,var(--tx) 8%,transparent)}.seg button.on{background:color-mix(in srgb,var(--card) 80%,transparent)}
.btn.sec{background:color-mix(in srgb,var(--tx) 9%,transparent)}.pal{background:color-mix(in srgb,var(--tx) 8%,transparent)}
.btn:not(.sec):not(.dg):not(.pl2):not(.mk){box-shadow:0 2px 10px color-mix(in srgb,var(--pri) 24%,transparent)}
.apb.big{box-shadow:0 0 0 5px color-mix(in srgb,var(--pri) 12%,transparent),0 3px 12px color-mix(in srgb,var(--pri) 26%,transparent)}
#nav button.on{box-shadow:0 2px 10px color-mix(in srgb,var(--pri) 25%,transparent)}
.tile .ib,.mono{border-radius:50%}
.rg circle{stroke:color-mix(in srgb,var(--tx) 12%,transparent)}.pgb{background:color-mix(in srgb,var(--tx) 12%,transparent)}
.awv i{background:color-mix(in srgb,var(--tx) 16%,transparent)}.awv i.on{background:var(--pri)}
/* تخفيف الزجاج: بطاقات صلبة بلا تغبيش */
[data-glass=lite] .card,[data-glass=lite] .sb,[data-glass=lite] #nav,[data-glass=lite] .hd,[data-glass=lite] .hero,[data-glass=lite] .dl,[data-glass=lite] .fw.au,[data-glass=lite] .chip:not(.on){background:var(--card)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.sb,#nav,.hd,.hero,.dl,.fw.au,.chip:not(.on){background:var(--card)!important}}
/* غلاف الصوت فيه حركة مستمرة، فنزيل تغبيشه الخلفي فقط ويبقى بقية الزجاج كما هو */
.fw.au{backdrop-filter:none;-webkit-backdrop-filter:none}
@media print{#bgl{display:none!important}.card,.hero,.hd,.sb,#nav{background:#fff!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;border:0!important}}
/* ===== اختيار المدة (قائمة منسدلة) وقبل/بعد وتحديد من–إلى وإيقاف الملاحظات ===== */
.rgb{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:16px;background:color-mix(in srgb,var(--pri) 13%,var(--card));color:var(--tx);border:1.5px solid color-mix(in srgb,var(--pri) 45%,transparent);font-weight:600}
.rgb .cv{width:18px;height:18px;stroke:var(--pri);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rgb small{color:var(--mu);font-weight:400}
.fm.rgb2{gap:3px;border:1px dashed rgba(255,255,255,.45)}.fm.rgb2 .cv{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rgl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.rgl .chip{min-height:44px;padding:0;display:grid;place-items:center}
.rgl .chip.wide{grid-column:span 2}
.rgd{margin:0 0 12px}.rgd small{display:block;margin-bottom:6px}
.rsb{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px}
.rsb b{font-size:14px;line-height:1.5}.rsb .tm{font-variant-numeric:tabular-nums;color:var(--pri);font-weight:600}
.btn.from{min-height:44px;padding:0 18px;border-radius:22px}
.btn.from.on{background:var(--c-dnu);color:#fff;box-shadow:none}
.stb{margin-top:10px;padding:12px 14px}.stb .bs{flex-direction:row;margin:10px 0 0}.stb .bs .btn{flex:1;padding:0 10px}
.fb.fri{top:calc(86px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:4px 12px;max-width:calc(100% - 24px);white-space:normal;text-align:center}
.fb.fri.on{display:flex}.fb.fri b{font-size:12px;font-weight:500}
.fb.fpn{left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 24px));padding:12px;max-height:90%;overflow:auto}
.fb.fpn .bs{flex-direction:row;flex-wrap:wrap}.fb.fpn .bs .btn{flex:1}
.fb.fpn .rgl{margin:8px 0;gap:6px;grid-template-columns:repeat(6,1fr)}.fb.fpn .rgl .chip.wide{grid-column:span 2}.fb.fpn .rgl .chip{min-height:38px}.fb.fpn .rgd{margin-bottom:8px}.fb.fpn .seg button{min-height:36px}.fb.fpn .bs{margin-top:8px!important}.fb.fpn .bs .btn{min-height:40px}.fb.fpn{max-height:calc(100% - 16px)}
/* سلاسة: نلغي أثقل المؤثرات على صفحة الدرس أثناء تشغيل الفيديو */
button,.chip,.lr,.tile,.btn{touch-action:manipulation}
body.fxon #nav,body.fxon #bgl,body.fxon #snack{display:none!important}
/* الزجاج الحيوي مع تمويه أخف (١٢px) وتشبّع ألوان أعلى، والنوافذ المنبثقة معتمة ليُقرأ كلامها */
.card,.hero,.chip,.sb,.fw.au{backdrop-filter:none;-webkit-backdrop-filter:none}
.card,.sb,.hd,.hero,#nav,.chip:not(.on){background:color-mix(in srgb,var(--card) 88%,transparent)}
:root[data-theme=dark] :is(.card,.sb,.hero,#nav,.chip:not(.on)){background:color-mix(in srgb,color-mix(in srgb,var(--card),#fff 5%) 90%,transparent)}
@media(prefers-color-scheme:dark){:root[data-theme=auto] :is(.card,.sb,.hero,#nav,.chip:not(.on)){background:color-mix(in srgb,color-mix(in srgb,var(--card),#fff 5%) 90%,transparent)}}
.card,.sb,.hd,.hero,#nav{border-color:transparent;box-shadow:0 3px 12px var(--sh)}
.dl,.fb.rc,.fb.fpn{background:var(--card)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.dl .chip:not(.on),.fb.fpn .chip:not(.on){background:var(--sec);border-color:transparent}.dl .rgl .chip,.fb.fpn .rgl .chip{backdrop-filter:none;-webkit-backdrop-filter:none}
#bgl{transform:translateZ(0);will-change:transform}
.lr,.chips{contain:layout style}
html{scroll-behavior:auto;-webkit-overflow-scrolling:touch}
.awv i{transition:none}
@media(prefers-reduced-motion:reduce){*:not(#sp):not(#sp *){animation:none!important;transition:none!important}}

/* ===== التعديلات الستة المعتمدة لتناسق الزجاج والبطاقات والنوافذ ===== */
/* ١. شريط الإشعار السفلي (#snack) وزر «تراجع» الزجاجي */
#snack{background:color-mix(in srgb,var(--card) 86%,transparent);color:var(--tx);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--gb);border-radius:24px;padding:8px 10px 8px 18px;box-shadow:0 10px 30px var(--sh),inset 0 1px 0 var(--hl)}
#snack button{min-height:38px;padding:0 18px;border-radius:16px;font-weight:600;background:var(--pri);color:var(--onpri);box-shadow:0 2px 8px color-mix(in srgb,var(--pri) 22%,transparent)}
[data-glass=lite] #snack{background:var(--card)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

/* ٢. النوافذ المنبثقة (.dl) وخلفية التعتيم المموّهة (.ov) */
.ov{background:rgba(10,14,8,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
[data-glass=lite] .ov{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(10,14,8,.58)}
[data-glass=full] .dl,[data-glass=full] .fb.rc,[data-glass=full] .fb.fpn{background:color-mix(in srgb,var(--card) 86%,transparent)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important;border:1px solid var(--gb)!important;box-shadow:0 16px 42px var(--sh),inset 0 1px 0 color-mix(in srgb,var(--pri) 26%,var(--hl))!important}
:root[data-theme=dark][data-glass=full] :is(.dl,.fb.rc,.fb.fpn){background:color-mix(in srgb,color-mix(in srgb,var(--card),#fff 6%) 86%,transparent)!important}
@media(prefers-color-scheme:dark){:root[data-theme=auto][data-glass=full] :is(.dl,.fb.rc,.fb.fpn){background:color-mix(in srgb,color-mix(in srgb,var(--card),#fff 6%) 86%,transparent)!important}}

/* ٣. استعادة الحدّ الزجاجي المضيء والتمويه للبطاقات الداخلية (.card, .hero, .hd, .sb, #nav) */
[data-glass=full] :is(.card,.sb,.hd,.hero,#nav){border:1px solid var(--gb);box-shadow:0 6px 20px var(--sh),inset 0 1px 0 color-mix(in srgb,var(--pri) 25%,var(--hl))}
@media screen{#s-lesson.bg{display:block;position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}}

/* ٤. حقول الإدخال (.in) وشرائح الاقتراحات والمدة (.chip) داخل النوافذ */
.in{border-radius:16px;background:color-mix(in srgb,var(--card) 62%,var(--sec));border:1.5px solid var(--gb);transition:border-color .18s,box-shadow .18s,background .18s}
.in:focus{border-color:var(--pri);background:color-mix(in srgb,var(--card) 85%,var(--sec));box-shadow:0 0 0 3.5px color-mix(in srgb,var(--pri) 20%,transparent)}
.dl .chip:not(.on),.fb.fpn .chip:not(.on){background:color-mix(in srgb,var(--pri) 11%,var(--card));border:1px solid color-mix(in srgb,var(--pri) 24%,var(--gb));color:var(--tx)}

/* ٥. أزرار النوافذ (.btn و .btn.sec) */
.btn{border-radius:18px}
.btn.sec{background:color-mix(in srgb,var(--tx) 7%,var(--card));border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hl)}

/* ٦. شارات نوع اللحظة الكبسولية (.tp) وشريط السحب (#dbar) وبطاقة التحديد (.rsb) */
.tp{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:16px;background:color-mix(in srgb,var(--t,var(--pri)) 15%,var(--card));color:var(--tx);border:1px solid color-mix(in srgb,var(--t,var(--pri)) 38%,transparent);font-size:13px;font-weight:600}
.tp .tdot{width:7px;height:7px;border-radius:50%;background:var(--t,var(--pri));flex:none}
#dbar,.rsb{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--gb);box-shadow:0 8px 28px var(--sh),inset 0 1px 0 var(--hl)}

/* ===== شاشة البداية المتحركة لشعار «لُباب / LUBAB» (دخول: انبثاق حريري + خروج: تبلور زجاجي + كشف الستار الزجاجي) ===== */
body.spon #app,body.spon #nav{pointer-events:none!important}
#spVeil{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:opacity .72s cubic-bezier(.22,1,.36,1)}
body.spon #spVeil{opacity:1;transition:none}
#sp.done,#spVeil.done{display:none!important}
#sp{position:fixed;inset:0;z-index:95;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}
.sp-box{display:flex;flex-direction:column;align-items:center;gap:14px;will-change:transform,opacity;transform:translateZ(0)}
.sp-stage{position:relative;width:min(236px,62vw);aspect-ratio:615/520;animation:silkStage 1.05s cubic-bezier(.16,1,.3,1) both;will-change:transform,opacity,filter}
.sp-stage.wave{filter:url(#waveFilter);animation:none}
.sp-wipe{position:absolute;top:0;right:0;bottom:0;width:100%;overflow:visible}
.sp-svg{position:absolute;top:0;right:0;width:min(236px,62vw);height:100%;display:block;overflow:visible;filter:none;background:transparent;border:0;box-shadow:none}
.sp-svg.ovl{pointer-events:none}
.sp-c1{fill:var(--pri)}
.sp-c2{fill:color-mix(in srgb,var(--pri) 58%,var(--card))}
:root[data-theme=dark] .sp-c1,:root[data-pal=ivory] .sp-c1,:root[data-pal=silver] .sp-c1{fill:var(--tx)}
:root[data-theme=dark] .sp-c2,:root[data-pal=ivory] .sp-c2,:root[data-pal=silver] .sp-c2{fill:var(--pri)}
@media(prefers-color-scheme:dark){:root[data-theme=auto] .sp-c1{fill:var(--tx)}:root[data-theme=auto] .sp-c2{fill:var(--pri)}}
.sp-b2,.sp-b3{animation:silkRibbon .85s .15s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box;transform-origin:right center;will-change:transform,opacity}
.sp-d1{animation:silkDot .5s .38s cubic-bezier(.34,1.56,.64,1) both;transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
.sp-d2{animation:silkDot .5s .58s cubic-bezier(.34,1.56,.64,1) both;transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
.sp-dm{animation:silkDot .55s .72s cubic-bezier(.34,1.56,.64,1) both;transform-box:fill-box;transform-origin:bottom left;will-change:transform,opacity}
.sp-en{font:600 16px/1 'IBM Plex Sans Arabic',system-ui,sans-serif;letter-spacing:.36em;padding-left:.36em;color:var(--pri);opacity:0;animation:spEnFast .5s .7s cubic-bezier(.22,1,.36,1) forwards;direction:ltr;user-select:none}
:root[data-theme=dark] .sp-en,:root[data-pal=ivory] .sp-en,:root[data-pal=silver] .sp-en{color:var(--tx);opacity:0}
@media(prefers-color-scheme:dark){:root[data-theme=auto] .sp-en{color:var(--tx);opacity:0}}
@keyframes silkStage{0%{opacity:0;transform:scale3d(.85,.85,1) translate3d(0,12px,0)}100%{opacity:1;transform:translate3d(0,0,0)}}
@keyframes silkRibbon{0%{opacity:0;transform:scaleX(.45) translateX(16px)}100%{opacity:1;transform:none}}
@keyframes silkDot{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@keyframes spEnFast{0%{opacity:0;letter-spacing:.18em;padding-left:.18em}100%{opacity:.9;letter-spacing:.36em;padding-left:.36em}}
@media print{#sp{display:none!important}}

/* ===== التعديلات السبعة الجديدة (شريط اللحظات، الرئيسية المتنوعة، بطاقة المتابعة، الذكر، مشغّل الإشعارات، وشاشة البداية بلا مربع) ===== */
#snack{gap:8px;padding:8px 10px 8px 16px}
#snack .s-nm{background:color-mix(in srgb,var(--pri) 15%,var(--card));color:var(--pri);border:1px solid color-mix(in srgb,var(--pri) 35%,transparent);box-shadow:none}
/* ٤. بطاقة الذكر العلوية (زجاج منشوري لامع حقيقي يكشف تفاصيل الخلفية والزخرفة) */
.hd{background:linear-gradient(115deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.38) 45%,rgba(255,255,255,.06) 55%,color-mix(in srgb,var(--p2) 12%,transparent) 100%)!important;backdrop-filter:blur(3px) saturate(1.3)!important;-webkit-backdrop-filter:blur(3px) saturate(1.3)!important;border:1.5px solid color-mix(in srgb,var(--pri) 45%,#fff)!important;box-shadow:0 8px 22px color-mix(in srgb,var(--pri) 12%,transparent),inset 0 1.5px 0 #fff!important;padding:16px 20px;border-radius:28px}
:root[data-theme=dark] .hd,:root[data-pal=ivory] .hd,:root[data-pal=silver] .hd{background:linear-gradient(115deg,rgba(255,255,255,.02) 0%,rgba(255,255,255,.13) 45%,rgba(255,255,255,.02) 55%,color-mix(in srgb,var(--p2) 15%,transparent) 100%)!important;border:1.5px solid color-mix(in srgb,var(--pri) 45%,rgba(255,255,255,.2))!important;box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)!important}
@media(prefers-color-scheme:dark){:root[data-theme=auto] .hd{background:linear-gradient(115deg,rgba(255,255,255,.02) 0%,rgba(255,255,255,.13) 45%,rgba(255,255,255,.02) 55%,color-mix(in srgb,var(--p2) 15%,transparent) 100%)!important;border:1.5px solid color-mix(in srgb,var(--pri) 45%,rgba(255,255,255,.2))!important;box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)!important}}
.hd-tag{display:inline-flex;align-items:center;gap:5px;padding:2px 11px;border-radius:12px;background:color-mix(in srgb,var(--pri) 16%,transparent);color:var(--pri);border:1px solid color-mix(in srgb,var(--pri) 35%,transparent);font-size:12px;font-weight:600;margin-bottom:4px}
.hd #dk{display:block;font-size:20px;font-weight:600;color:var(--tx)}
/* ٣. بطاقة «تابع من حيث توقفت» البارزة */
.hero{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:18px;border-radius:28px;background:linear-gradient(145deg,color-mix(in srgb,var(--pri) 14%,var(--card)),color-mix(in srgb,var(--card) 92%,transparent))!important;border:1.5px solid color-mix(in srgb,var(--pri) 36%,var(--gb))!important;box-shadow:0 10px 28px var(--sh),inset 0 1px 0 var(--hl)!important}
.h-top{display:flex;align-items:center;justify-content:space-between}
.h-bdg{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:14px;background:var(--pri);color:var(--onpri);font-size:12.5px;font-weight:600}
.h-bdg .ic{width:15px;height:15px;fill:currentColor}
.h-pct{font-size:15px;color:var(--pri);font-weight:600}
.h-mid{display:flex;align-items:center;gap:12px}
.h-mid .th{width:88px;height:58px;border-radius:16px;box-shadow:0 4px 12px var(--sh)}
.h-mid h3{margin:0 0 4px;font-size:17px;font-weight:600;line-height:1.35}
.h-pgb{height:7px;border-radius:4px;background:color-mix(in srgb,var(--tx) 12%,transparent);overflow:hidden}
.h-pgb i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--pri));border-radius:4px;transition:width .3s ease}
.h-btn{width:100%;min-height:46px;border-radius:18px;font-size:15px}
/* ٥. تنويع أقسام الصفحة الرئيسية */
.rev-strip{width:100%;text-align:right;margin-top:14px;padding:14px 16px;border-radius:24px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--gb);box-shadow:0 6px 20px var(--sh);display:flex;align-items:center;gap:12px}
.rev-go{padding:6px 14px;border-radius:14px;background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri);font-weight:600;font-size:13px;flex:none}
.add-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.add-pill{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 8px;border-radius:24px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--gb);box-shadow:0 6px 18px var(--sh),inset 0 1px 0 var(--hl);transition:transform .12s}
.add-pill:active{transform:scale(.96)}
.add-pill .ib{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--pri) 15%,transparent);color:var(--pri);display:grid;place-items:center;margin-bottom:4px}
.add-pill b{font-size:13.5px;font-weight:600;line-height:1.3}
.add-pill small{font-size:11.5px;line-height:1.2}
.mom-row{width:100%;text-align:right;display:flex;align-items:center;gap:12px;padding:14px 16px;border-inline-start:4px solid var(--mc,var(--pri))!important}
.mom-go{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri);display:grid;place-items:center;flex:none}
.mom-go .ic{width:18px;height:18px}
/* ٦. مشغّل الوسائط العلوي العائم (#mbar) المتزامن مع شريط الإشعارات */
.mbar{position:sticky;top:6px;z-index:25;max-width:528px;margin:6px auto 0;padding:8px 12px 12px;border-radius:22px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid color-mix(in srgb,var(--pri) 35%,var(--gb));box-shadow:0 10px 28px var(--sh);display:flex;align-items:center;gap:10px;overflow:hidden}
.mbar-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.mbar-main .th{width:48px;height:34px;border-radius:10px}
.mbar-main b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar-ctl{display:flex;align-items:center;gap:2px;flex:none}
.mbar-ctl .ibt{width:34px;height:34px;font-size:14px;color:var(--tx)}
.mbar-pl{width:38px;height:38px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center}
.mbar-pl .ic{width:18px;height:18px;fill:currentColor}
.mbar-pg{position:absolute;left:0;right:0;bottom:0;height:3px;background:color-mix(in srgb,var(--tx) 10%,transparent)}
.mbar-pg i{display:block;height:100%;width:0%;background:var(--pri);transition:width .4s linear}



/* ===== المسرح السينمائي المتكامل لشاشة الدرس (#s-lesson) + شفافية الأزرار والشريط السفلي ===== */
.l-back{background:color-mix(in srgb,var(--card) 42%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--gb);border-radius:50%}
.c1-frame{border-radius:26px;overflow:hidden;background:color-mix(in srgb,var(--card) 38%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid color-mix(in srgb,var(--pri) 38%,var(--gb));box-shadow:0 12px 32px color-mix(in srgb,var(--pri) 14%,var(--sh)),inset 0 1px 0 var(--hl)}
.c1-frame .fw:not(.fs):not(.fx){border-radius:0}
.c1-frame .vcb{margin-top:0;padding:8px 10px;border-radius:0;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 22%,transparent),color-mix(in srgb,var(--card) 52%,transparent));border-top:1px solid var(--gb);box-shadow:none;gap:6px}
.c1-frame .vb{min-height:40px;border-radius:14px;background:color-mix(in srgb,var(--card) 32%,transparent);border:1px solid var(--gb);color:var(--tx);font-size:13.5px}
.c1-frame .vb.vw{background:color-mix(in srgb,var(--pri) 22%,transparent);border-color:color-mix(in srgb,var(--pri) 48%,transparent);color:var(--pri)}
.c1-mom{padding:14px!important;border-radius:26px!important;background:color-mix(in srgb,var(--card) 36%,transparent)!important;backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important;border:1px solid var(--gb)!important;box-shadow:0 8px 24px var(--sh),inset 0 1px 0 var(--hl)!important}
.c1-mhd{margin-bottom:10px;gap:8px}
.c1-mhd .rgb{min-height:34px;padding:0 12px;border-radius:12px;font-size:13px;background:color-mix(in srgb,var(--pri) 20%,transparent);border:1px solid color-mix(in srgb,var(--pri) 45%,transparent);color:var(--pri)}
.c1-mom .mkg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c1-mom .mkg .btn.mk{min-height:42px;padding:0 8px;border-radius:16px;background:color-mix(in srgb,var(--t,var(--pri)) 12%,color-mix(in srgb,var(--card) 26%,transparent));border:1px solid color-mix(in srgb,var(--t,var(--pri)) 38%,var(--gb));box-shadow:inset 0 1px 0 rgba(255,255,255,.12);font-size:13.5px;font-weight:600}
.c1-mom .mkg .btn.mk .dot{box-shadow:0 0 8px var(--t,var(--pri))}
[data-glass=full] #nav{background:color-mix(in srgb,var(--card) 38%,transparent)!important;backdrop-filter:blur(14px) saturate(1.3)!important;-webkit-backdrop-filter:blur(14px) saturate(1.3)!important;border:1px solid var(--gb)!important}
[data-glass=full] #s-lesson .chip:not(.on){background:color-mix(in srgb,var(--card) 32%,transparent)!important;backdrop-filter:blur(8px)!important;-webkit-backdrop-filter:blur(8px)!important;border:1px solid var(--gb)!important}

/* ===== التصميم ٢ لملء الشاشة العريضة: درج الحافة المنسدل الذكي (Edge Pull-Tab) ===== */
.fw .fc{top:calc(6px + env(safe-area-inset-top));left:calc(6px + env(safe-area-inset-left));width:32px;height:32px;border-radius:50%;background:rgba(15,28,38,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);opacity:.68;transition:opacity .2s}
.fw .fc:active,.fw .fc:hover{opacity:1}
.fw .fh{top:0;left:50%;transform:translateX(-50%);width:96px;height:20px;border-radius:0 0 13px 13px;padding:0 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px;background:rgba(15,28,38,.36);backdrop-filter:blur(8px) saturate(1.3);-webkit-backdrop-filter:blur(8px) saturate(1.3);border:1px solid rgba(255,255,255,.32);border-top:0;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.22);transition:background .2s,opacity .2s}
.fw .fh:active{background:rgba(15,28,38,.55)}
.fw .fbar{top:calc(23px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;padding:5px 8px;max-width:calc(100% - 88px);border-radius:18px;background:rgba(15,28,38,.26);backdrop-filter:blur(10px) saturate(1.35);-webkit-backdrop-filter:blur(10px) saturate(1.35);border:1px solid rgba(255,255,255,.34);box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.35);transition:opacity .26s cubic-bezier(.22,1,.36,1),transform .26s cubic-bezier(.22,1,.36,1)}
.fw .fbar.shut{opacity:0;transform:translateX(-50%) translateY(-22px) scale(.92)!important;pointer-events:none}
.fw .fm{min-width:34px;min-height:34px;padding:0 10px;border-radius:11px;font-size:12px;font-weight:600;background:rgba(15,28,38,.36);border:1px solid rgba(255,255,255,.22);gap:5px;transition:transform .12s,background .18s}
.fw .fm:active{transform:scale(.94);background:rgba(255,255,255,.24)}
.fw .fm.fup{min-width:30px;padding:0 8px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);font-size:11px}
.fw .bg{width:30px;height:30px;border-radius:9px}
.fw .ftt,.fw .fb.fri{top:calc(66px + env(safe-area-inset-top));background:rgba(15,28,38,.48);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.32);border-radius:16px}
</style>
</head>

 if(mb){const showMb=MBAR_ON&&cur!=='lesson'&&!!curLId;mb.style.display=showMb?'':'none';

 if(!('mediaSession' in navigator))return;
 try{
  const g=D.lists.find(x=>x.id===l.list),art=l.thumb||(l.type==='yt'?'https://i.ytimg.com/vi/'+l.src+'/hqdefault.jpg':'');

   navigator.mediaSession.metadata=new MediaMetadata({title:l.title,artist:g?g.name:'لُباب · Lubab',album:'لُباب',artwork:art?[{src:art,sizes:'512x512',type:'image/jpeg'}]:[]});
   navigator.mediaSession.setActionHandler('play',()=>{pplay();pauseAt=0;msUpd()});

   navigator.mediaSession.setActionHandler('seekto',e=>{if(e.seekTime!=null)pseek(e.seekTime)});

  }

  if(d>0&&isFinite(d)&&navigator.mediaSession.setPositionState){navigator.mediaSession.setPositionState({duration:d,playbackRate:SPD||1,position:Math.min(d,Math.max(0,p))})}
 }catch(e){}}
