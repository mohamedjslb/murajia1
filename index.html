:root,[data-theme=light]{--bg:#F4F6EF;--card:#fff;--sec:#E8EEDD;--pri:#5A7A40;--onpri:#fff;--tx:#1F2A1A;--mu:#5E6B55;--sh:rgba(40,60,30,.10);color-scheme:light}
[data-theme=dark]{--bg:#12150F;--card:#1C2117;--sec:#2A3222;--pri:#8FA66B;--onpri:#12150F;--tx:#E6EAD9;--mu:#A3AE96;--sh:rgba(0,0,0,.35);color-scheme:dark}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#12150F;--card:#1C2117;--sec:#2A3222;--pri:#8FA66B;--onpri:#12150F;--tx:#E6EAD9;--mu:#A3AE96;--sh:rgba(0,0,0,.35);color-scheme:dark}}
:root{--c-imp:#B7791F;--c-law:#3F7F86;--c-how:#6B8F3A;--c-dnu:#A9553F;--c-note:#7C8777}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.65 'IBM Plex Sans Arabic','Noto Naskh Arabic',system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:auto;padding:14px 16px calc(112px + env(safe-area-inset-bottom))}
.scr{display:none}.scr.on{display:block}
h1{font-size:25px;line-height:1.3;margin:6px 0 14px;font-weight:600}
h2{font-size:15px;margin:24px 0 10px;color:var(--mu);font-weight:500}
h3{margin:0 0 6px;font-size:17px}
p{margin:0 0 12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--tx)}
.card{background:var(--card);border-radius:22px;box-shadow:0 4px 18px var(--sh);padding:16px}
.btn{min-height:46px;padding:0 20px;border-radius:16px;background:var(--pri);color:var(--onpri);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--sec);color:var(--tx)}.btn.dg{background:var(--c-dnu);color:#fff}.btn[disabled]{opacity:.45}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center;gap:12px}.gr{flex:1;min-width:0}
.mu{color:var(--mu)}small{color:var(--mu);font-size:13px}
.ibt{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--mu)}
.top{display:flex;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-height:112px;width:100%}
.tile .ib{width:42px;height:42px;border-radius:14px;background:var(--sec);display:grid;place-items:center;color:var(--pri);margin-bottom:6px}
.tile.sel{outline:2px solid var(--pri)}
.hero{background:var(--pri);color:var(--onpri);border-radius:24px;padding:18px;box-shadow:0 6px 20px var(--sh)}
.hero small{color:inherit;opacity:.85}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.3);margin:12px 0}
[data-theme=dark] .bar{background:rgba(0,0,0,.25)}
.bar i{display:block;height:100%;border-radius:6px;background:var(--onpri)}
.hero .btn{background:var(--onpri);color:var(--pri)}
.empty{text-align:center;padding:26px 18px}
.empty .ib{width:52px;height:52px;border-radius:18px;background:var(--sec);color:var(--pri);display:grid;place-items:center;margin:0 auto 12px}
.empty .ib .ic{width:26px;height:26px}
.lr{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;user-select:none;-webkit-user-select:none}
.th{width:76px;height:50px;border-radius:12px;object-fit:cover;background:var(--sec);flex:none}
.ph{display:grid;place-items:center;color:var(--pri)}
.lr b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pw iframe,#pw video{width:100%;height:100%;border:0}
.mkg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mk{min-height:48px;padding:0 8px;border-radius:16px}
textarea.in{display:block}
.fw{position:relative;border-radius:20px;overflow:hidden;background:#000}
.fw #pw{aspect-ratio:16/9;width:100%;transform-origin:center}
.fw.fs,.fw.fx{border-radius:0;display:flex;align-items:center}
.fw.fs #pw,.fw.fx #pw{aspect-ratio:auto;height:100%}
.fw.fx{position:fixed;inset:0;width:100dvw;height:100dvh;z-index:40}
.fw.fx.rot{inset:auto;top:0;left:0;width:100dvh;height:100dvw;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
#fl{display:none;position:absolute;inset:0;pointer-events:none;z-index:5}
.fw.fs #fl,.fw.fx #fl{display:block}
.fb{position:absolute;pointer-events:auto;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--tx);border-radius:16px;box-shadow:0 4px 18px var(--sh)}
.fbar{top:calc(26px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:2px;align-items:center;padding:4px;max-width:calc(100% - 110px);overflow-x:auto}
.fm{min-width:44px;min-height:44px;padding:0 8px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;white-space:nowrap}
.bg{width:32px;height:32px;border-radius:10px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;flex:none;touch-action:none}.bg .ic{width:18px;height:18px}
.fc{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
.fh{top:0;left:50%;transform:translateX(-50%);width:60px;height:22px;border-radius:0 0 12px 12px;padding:0}
.ftt{top:calc(86px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:4px 12px;white-space:nowrap}
.fzc{bottom:calc(8px + env(safe-area-inset-bottom));left:calc(8px + env(safe-area-inset-left));display:none;gap:4px;padding:6px;flex-wrap:wrap;width:196px}.fzc.on{display:flex}
.rc{bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));padding:12px;max-height:90%;overflow:auto}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--c-dnu);animation:pl 1s infinite}@keyframes pl{50%{opacity:.25}}
.stk{display:flex;flex-direction:column;gap:12px}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:0 14px;min-height:48px;box-shadow:0 4px 18px var(--sh);color:var(--mu)}
.sb input{flex:1;border:0;background:none;outline:0;min-height:44px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:20px;background:var(--sec);color:var(--tx)}
.chip.on{background:var(--pri);color:var(--onpri)}
.in{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--sec);background:var(--bg);padding:0 14px;outline:0}
.in:focus{border-color:var(--pri)}
.in.l{direction:ltr;text-align:left}
.err{color:var(--c-dnu);font-size:14px;margin:8px 0 0;min-height:1px}
#nav{position:fixed;z-index:20;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));margin:auto;width:min(320px,calc(100% - 32px));display:flex;gap:6px;padding:6px;border-radius:30px;background:var(--card);box-shadow:0 8px 28px var(--sh)}
#nav button{flex:1;min-height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mu);font-weight:500}
#nav button.on{background:var(--pri);color:var(--onpri)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,8,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.ov.sheet{align-items:flex-end;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.dl{width:min(420px,100%);max-height:85dvh;overflow:auto}
.bs{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#snack{position:fixed;z-index:60;left:0;right:0;margin:auto;bottom:calc(88px + env(safe-area-inset-bottom));width:min(360px,calc(100% - 32px));background:var(--tx);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:10px}
#snack.on{display:flex}#snack span{flex:1}
#snack button{min-height:40px;padding:0 14px;border-radius:12px;font-weight:600;color:var(--pri);background:var(--bg)}
.seg{display:flex;gap:6px;background:var(--sec);padding:4px;border-radius:16px}
.seg button{flex:1;min-height:42px;border-radius:12px;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 2px 8px var(--sh)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;min-height:48px}
.set+.set{border-top:1px solid var(--sec)}.set select{max-width:150px}
.set input[type=checkbox]{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--sec);position:relative;flex:none;margin:0}
.set input[type=checkbox]::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--mu);transition:.15s}
.set input[type=checkbox]:checked{background:var(--pri)}
.set input[type=checkbox]:checked::after{right:23px;background:var(--onpri)}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:10px;background:var(--sec)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px}
.noprint{}
@media print{html,html[data-theme]{--bg:#fff;--card:#fff;--sec:#ddd;--tx:#000;--mu:#444;--sh:transparent}body{padding:0}#nav,#snack,.noprint{display:none!important}.scr{display:none!important}#s-sheet{display:block!important}#app{padding:0;max-width:none}}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
 <section class="scr" id="s-home"></section>
 <section class="scr" id="s-lessons">
  <h1>دروسي</h1>
  <label class="sb"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="ابحث في دروسك ولحظاتك"></label>
  <div class="chips" id="lchips"></div>
  <div class="stk" id="lbody"></div>
 </section>
 <section class="scr" id="s-add"></section>
 <section class="scr" id="s-settings"></section>
 <section class="scr" id="s-lesson"></section>
 <section class="scr" id="s-review"></section>
 <section class="scr" id="s-sheet"></section>
</div>
<nav id="nav" aria-label="التنقل">
 <button data-a="tab" data-v="home"></button>
 <button data-a="tab" data-v="lessons"></button>
</nav>
<div id="snack"><span></span><button>تراجع</button></div>
<input type="file" id="fi" hidden>
<input type="file" id="pk" hidden>
<input type="file" id="rs" accept="application/json,.json" hidden>

<script>
const $=s=>document.querySelector(s),ar=n=>Number(n).toLocaleString('ar-EG'),
esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/>',
set:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
yt:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
film:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l4 2.5-4 2.5z"/>',
pdf:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
more:'<circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/>',
back:'<path d="M5 12h14M13 6l6 6-6 6"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
paste:'<rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V3h6v2M9 12h6M9 16h4"/>',
play:'<path d="M8 5l11 7-11 7z"/>',
moment:'<path d="M6 3h12v18l-6-4-6 4z"/>'};
P.mic='<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>';P.zoom='<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11h6M11 8v6"/>';
const ic=n=>'<svg class="ic" viewBox="0 0 24 24">'+P[n]+'</svg>';

/* ---------- التخزين ---------- */
const K='mrj_v1';let D;
function load(){let o=null;try{o=JSON.parse(localStorage.getItem(K))}catch(e){}
 D=o&&typeof o==='object'?o:{};D.v=1;D.lessons=D.lessons||[];D.lists=D.lists||[];D.moments=D.moments||[];
 D.settings=Object.assign({theme:'auto',cap:45,back:5,margin:3,pause:true,lang:'ar-SA',later:false,model:'gemini-flash-latest',gkey:'',ykey:'',mode:'tap',bar:true,rng:0,aud:false},D.settings||{});
 D.usage=D.usage||{m:'',n:0};}
function save(q){if(!q){D.mt=Date.now();schedPush()}try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){toast('تعذّر الحفظ: مساحة التخزين ممتلئة');return false}}
const idbo=()=>new Promise((r,j)=>{const q=indexedDB.open('mrj',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function idb(m,k,v){const d=await idbo();return new Promise((r,j)=>{const t=d.transaction('f',m==='get'?'readonly':'readwrite'),s=t.objectStore('f'),q=m==='put'?s.put(v,k):m==='get'?s.get(k):s.delete(k);t.oncomplete=()=>r(q.result);t.onerror=()=>j(t.error);t.onabort=()=>j(t.error)})}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const S=()=>D.settings;
function applyTheme(){document.documentElement.dataset.theme=S().theme}

/* ---------- واجهة مساعدة ---------- */
let sTimer;
function toast(m){inFS()?ftoast(m):snack(m)}
function snack(m,undo){const e=$('#snack');e.querySelector('span').textContent=m;const b=e.querySelector('button');b.style.display=undo?'':'none';b.onclick=()=>{clearTimeout(sTimer);e.classList.remove('on');undo&&undo()};e.classList.add('on');clearTimeout(sTimer);sTimer=setTimeout(()=>e.classList.remove('on'),undo?5000:3200)}
function dlg(o){const e=document.createElement('div');e.className='ov'+(o.sheet?' sheet':'');
 e.innerHTML='<div class="dl card" role="dialog">'+(o.t?'<h3>'+o.t+'</h3>':'')+(o.p?'<p class="mu">'+o.p+'</p>':'')+(o.inp!==undefined?'<input class="in" id="di" value="'+esc(o.inp)+'" placeholder="'+esc(o.ph||'')+'">':'')+'<div class="bs">'+o.b.map((b,i)=>'<button class="btn '+(b.c===undefined?'sec':b.c)+'" data-i="'+i+'">'+b.t+'</button>').join('')+'</div></div>';
 e.onclick=ev=>{const bt=ev.target.closest('[data-i]');if(bt){const v=e.querySelector('#di');const val=v?v.value:'';e.remove();const b=o.b[bt.dataset.i];b.f&&b.f(val)}else if(ev.target===e)e.remove()};
 document.body.append(e);const i=e.querySelector('#di');i&&i.focus()}
const empty=(i,t,b)=>'<div class="card empty"><div class="ib">'+ic(i)+'</div><p class="mu">'+t+'</p>'+(b||'')+'</div>';
const fmtT=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,p=n=>String(n).padStart(2,'0');return ((h?h+':':'')+p(m)+':'+p(c)).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])};

/* ---------- التنقل ---------- */
let cur='home',curX=null;
function show(n,x){if(n!=='lesson')stopP();cur=n;curX=x||null;document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==='s-'+n));
 $('#nav').style.display=(n==='home'||n==='lessons')?'':'none';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===n));
 render(n);scrollTo(0,0)}
function go(n,x){if(n==='home'||n==='lessons')history.replaceState({s:n},'');else history.pushState({s:n,x:x||null},'');show(n,x)}
let fsBack=false;
addEventListener('popstate',e=>{if(fsBack){fsBack=false;return}if(inFS()){fsOff();return}const s=e.state||{s:'home'};show(s.s,s.x)});
function render(n){({home:rHome,lessons:rLessons,add:rAdd,settings:rSet,lesson:rLesson,review:rReview,sheet:rSheet})[n||cur]()}

/* ---------- الرئيسية ---------- */
const TYPES={yt:['yt','رابط يوتيوب','فيديو واحد'],pl:['list','قائمة تشغيل','كل دروسها دفعة واحدة'],file:['film','فيديو أو صوت','من جهازك'],pdf:['pdf','ملف PDF','من جهازك']};
const MT={imp:['مهم','--c-imp'],law:['قانون','--c-law'],how:['طريقة حل','--c-how'],dnu:['لم أفهم','--c-dnu'],note:['ملاحظة','--c-note']};
function rHome(){
 const last=[...D.lessons].filter(l=>l.opened).sort((a,b)=>b.opened-a.opened)[0];
 let h='<div class="top"><div><small>مراجع</small><h1 style="margin:0">أهلاً بك</h1></div><button class="ibt" data-a="settings" aria-label="الإعدادات">'+ic('set')+'</button></div>';
 if(last){const p=last.dur?Math.min(100,Math.round(last.pos/last.dur*100)):0;
  h+='<div class="hero" style="margin-top:14px"><small>تابع من حيث وقفت</small><h3 style="margin:4px 0 0">'+esc(last.title)+'</h3><div class="bar"><i style="width:'+p+'%"></i></div><div class="row"><small class="gr">'+ar(mc(last.id))+' لحظة</small><button class="btn" data-a="open" data-id="'+last.id+'">'+ic('play')+'متابعة</button></div></div>'}
 const dn=dueList().length;if(D.moments.some(m=>m.type!=='note'))h+='<button class="card row" style="width:100%;text-align:right;margin-top:14px" data-a="rev"><span class="tile" style="min-height:0;width:auto"><span class="ib" style="margin:0">'+ic('check')+'</span></span><div class="gr"><b>المراجعة</b><br><small>'+(dn?ar(dn)+' لحظة تنتظرك':'لا شيء للمراجعة الآن')+'</small></div></button>';
 h+='<h2>إضافة درس</h2><div class="grid">'+Object.keys(TYPES).map(k=>'<button class="card tile" data-a="addt" data-t="'+k+'"><span class="ib">'+ic(TYPES[k][0])+'</span><b>'+TYPES[k][1]+'</b><small>'+TYPES[k][2]+'</small></button>').join('')+'</div>';
 h+='<h2>آخر لحظاتك</h2>';
 const ms=[...D.moments].sort((a,b)=>b.t-a.t).slice(0,5).filter(m=>D.lessons.some(l=>l.id===m.lesson));
 h+=ms.length?'<div class="stk">'+ms.map(m=>{const l=D.lessons.find(x=>x.id===m.lesson),t=MT[m.type]||MT.note;return '<button class="card row" style="text-align:right;width:100%" data-a="open" data-id="'+l.id+'"><span class="dot" style="background:var('+t[1]+')"></span><div class="gr"><b>'+esc(m.name||t[0])+'</b><br><small>'+esc(l.title)+' · '+(l.type==='pdf'?'صفحة '+ar(m.pos):'من الدقيقة '+fp(m))+'</small></div></button>'}).join('')+'</div>'
  :empty('moment','لحظاتك المهمة ستظهر هنا بعد أن تبدأ درسك الأول');
 $('#s-home').innerHTML=h}
const mc=id=>D.moments.filter(m=>m.lesson===id).length;

/* ---------- دروسي ---------- */
const L={q:'',f:'all'};
const thumb=l=>l.thumb?'<img class="th" alt="" src="'+l.thumb+'">':l.type==='yt'?'<img class="th" loading="lazy" alt="" src="https://i.ytimg.com/vi/'+esc(l.src)+'/mqdefault.jpg">':'<div class="th ph">'+ic(l.type==='pdf'?'pdf':'film')+'</div>';
const lrow=l=>'<div class="lr" data-a="open" data-id="'+l.id+'" data-lp="'+l.id+'">'+thumb(l)+'<div class="gr"><b>'+esc(l.title)+'</b><small>'+ar(mc(l.id))+' لحظة</small></div><button class="ibt" data-a="lmenu" data-id="'+l.id+'" aria-label="خيارات">'+ic('more')+'</button></div>';
function rLessons(){
 $('#q').value=L.q;
 if(!D.lessons.length){$('#lchips').innerHTML='';$('#lbody').innerHTML=empty('book','دروسك ستظهر هنا. أضف درسك الأول من الصفحة الرئيسية','<button class="btn" data-a="tab" data-v="home">إضافة درس</button>');return}
 if(L.f!=='all'&&!D.lists.some(x=>x.id===L.f))L.f='all';
 $('#lchips').innerHTML=[['all','الكل']].concat(D.lists.map(x=>[x.id,x.name])).map(c=>'<button class="chip'+(L.f===c[0]?' on':'')+'" data-a="chip" data-f="'+c[0]+'">'+esc(c[1])+'</button>').join('');
 const q=L.q.trim().toLowerCase(),ok=l=>!q||l.title.toLowerCase().includes(q)||D.moments.some(m=>m.lesson===l.id&&((m.name||'')+' '+(m.note||'')).toLowerCase().includes(q));let h='';
 D.lists.filter(x=>L.f==='all'||L.f===x.id).forEach(x=>{
  const all=D.lessons.filter(l=>l.list===x.id),nm=q&&x.name.toLowerCase().includes(q),its=all.filter(l=>nm||ok(l));
  if(q&&!its.length)return;
  h+='<div class="card"><div class="row"><div class="gr"><b>'+esc(x.name)+'</b><br><small>'+ar(all.length)+' درس · '+ar(all.reduce((a,l)=>a+mc(l.id),0))+' لحظة</small></div><button class="ibt" data-a="gmenu" data-id="'+x.id+'" aria-label="خيارات القائمة">'+ic('more')+'</button></div>'+its.map(lrow).join('')+'</div>'});
 if(L.f==='all')D.lessons.filter(l=>!D.lists.some(x=>x.id===l.list)&&ok(l)).forEach(l=>h+='<div class="card" style="padding:8px 16px">'+lrow(l)+'</div>');
 $('#lbody').innerHTML=h||empty('book','لا توجد نتائج مطابقة')}

/* ---------- القوائم والحذف ---------- */
function undoable(fn,msg){const snap=JSON.stringify([D.lessons,D.lists,D.moments]),before=D.lessons.filter(l=>l.type==='file'||l.type==='pdf').map(l=>l.id);
 fn();save();render();
 snack(msg,()=>{[D.lessons,D.lists,D.moments]=JSON.parse(snap);save();render();});
 setTimeout(()=>{before.filter(id=>!D.lessons.some(l=>l.id===id)).forEach(id=>idb('del',id).catch(()=>{}))},5400)}
function delLesson(id){const l=D.lessons.find(x=>x.id===id);if(!l)return;
 dlg({t:'هل تريد حذف الدرس؟',p:'سيُحذف معه كل ما سجّلته فيه.',b:[{t:'حذف',c:'dg',f:()=>{const inLesson=cur==='lesson';undoable(()=>{D.lessons=D.lessons.filter(x=>x.id!==id);D.moments=D.moments.filter(m=>m.lesson!==id)},'تم حذف الدرس');}},{t:'إلغاء'}]})}

 dlg({t:'حذف القائمة «'+esc(x.name)+'»',p:'ماذا تريد أن تفعل بدروسها؟',b:[

 callback:r=>{if(r&&r.access_token){GT=r.access_token;GE=Date.now()+((r.expires_in||3600)-60)*1000;gW.ok()}else gW.no(new Error('auth'))},error_callback:()=>gW.no(new Error('auth'))});

  if(!r){await gPush()}

 catch(e){const m=e.message;if(m==='tok'){gPend=true;gSt('اضغط أي مكان لإعادة الاتصال بحسابك')}else gSt(m==='g'?'تعذّر تحميل خدمة جوجل. تحقق من الإنترنت.':m==='auth'?'لم يكتمل تسجيل الدخول.':m==='h403'?'فعّل Google Drive API في مشروعك ثم أعد المحاولة.':navigator.onLine?'تعذّرت المزامنة ('+m+').':'لا يوجد اتصال بالإنترنت.')}
