#nav button.on{box-shadow:0 6px 20px color-mix(in srgb,var(--pri) 50%,transparent)}
.tile .ib,.mono{border-radius:50%}
.rg circle{stroke:color-mix(in srgb,var(--tx) 12%,transparent)}.pgb{background:color-mix(in srgb,var(--tx) 12%,transparent)}

/* تخفيف الزجاج: بطاقات صلبة بلا تغبيش */
[data-glass=lite] .card,[data-glass=lite] .sb,[data-glass=lite] #nav,[data-glass=lite] .hd,[data-glass=lite] .hero,[data-glass=lite] .dl,[data-glass=lite] .fw.au,[data-glass=lite] .chip:not(.on){background:var(--card)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
[data-glass=lite] #bgl .gg{display:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.sb,#nav,.hd,.hero,.dl,.fw.au,.chip:not(.on){background:var(--card)!important}}
@media print{#bgl{display:none!important}.card,.hero,.hd,.sb,#nav{background:#fff!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;border:0!important}}
/* ===== اختيار المدة (قائمة منسدلة) وقبل/بعد وتحديد من–إلى وإيقاف الملاحظات ===== */
.rgb{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:16px;background:color-mix(in srgb,var(--pri) 13%,var(--card));color:var(--tx);border:1.5px solid color-mix(in srgb,var(--pri) 45%,transparent);font-weight:600}
.rgb .cv{width:18px;height:18px;stroke:var(--pri);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rgb small{color:var(--mu);font-weight:400}
.fm.rgb2{gap:3px;border:1px dashed rgba(255,255,255,.45)}.fm.rgb2 .cv{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rgl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.rgl .chip{min-height:44px;padding:0;display:grid;place-items:center}
.rgl .chip.wide{grid-column:span 2}
.rgd{margin:0 0 12px}.rgd small{display:block;margin-bottom:6px}
.rsb{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px}
.rsb b{font-size:14px;line-height:1.5}.rsb .tm{font-variant-numeric:tabular-nums;color:var(--pri);font-weight:600}
.btn.from{min-height:44px;padding:0 18px;border-radius:22px}
.btn.from.on{background:var(--c-dnu);color:#fff;box-shadow:none}
.stb{margin-top:10px;padding:12px 14px}.stb .bs{flex-direction:row;margin:10px 0 0}.stb .bs .btn{flex:1;padding:0 10px}
.fb.fri{top:calc(86px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:4px 12px;max-width:calc(100% - 24px);white-space:normal;text-align:center}
.fb.fri.on{display:flex}.fb.fri b{font-size:12px;font-weight:500}
.fb.fpn{left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 24px));padding:12px;max-height:90%;overflow:auto}
.fb.fpn .bs{flex-direction:row;flex-wrap:wrap}.fb.fpn .bs .btn{flex:1}
.fb.fpn .rgl{margin:8px 0;gap:6px;grid-template-columns:repeat(6,1fr)}.fb.fpn .rgl .chip.wide{grid-column:span 2}.fb.fpn .rgl .chip{min-height:38px}.fb.fpn .rgd{margin-bottom:8px}.fb.fpn .seg button{min-height:36px}.fb.fpn .bs{margin-top:8px!important}.fb.fpn .bs .btn{min-height:40px}.fb.fpn{max-height:calc(100% - 16px)}
/* سلاسة: نلغي أثقل المؤثرات على صفحة الدرس أثناء تشغيل الفيديو */
button,.chip,.lr,.tile,.btn{touch-action:manipulation}
body.fxon #nav,body.fxon #bgl,body.fxon #snack{display:none!important}
/* الزجاج الحيوي مع تمويه أخف (١٢px) وتشبّع ألوان أعلى، والنوافذ المنبثقة معتمة ليُقرأ كلامها */
.card,.hero,.chip,.sb,.fw.au{backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%)}
.dl,.fb.rc,.fb.fpn{background:var(--card)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.dl .chip:not(.on),.fb.fpn .chip:not(.on){background:var(--sec);border-color:transparent}.dl .rgl .chip,.fb.fpn .rgl .chip{backdrop-filter:none;-webkit-backdrop-filter:none}
#bgl{transform:translateZ(0);will-change:transform}
.lr,.chips{contain:layout style}
html{scroll-behavior:auto;-webkit-overflow-scrolling:touch}
.awv i{transition:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<div id="app">
 <section class="scr" id="s-home"></section>

 </section>

<script>
const $=s=>document.querySelector(s),ar=n=>Number(n).toLocaleString('ar-EG'),
esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GCID=''; /* معرّف عميل Google للمزامنة: ضعه هنا مرة واحدة ولن يراه المستخدم */
const gid=()=>GCID||(typeof D!=='undefined'&&D&&D.settings&&D.settings.gcid)||'';
const AI_ON=false; /* ميزات الذكاء الاصطناعي (Gemini) مخفية حالياً. غيّرها إلى true لإعادتها */
const P={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/>',
set:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
yt:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
film:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l4 2.5-4 2.5z"/>',
pdf:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
more:'<circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/>',
back:'<path d="M5 12h14M13 6l6 6-6 6"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
paste:'<rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V3h6v2M9 12h6M9 16h4"/>',
play:'<path d="M8 5l11 7-11 7z"/>',
moment:'<path d="M6 3h12v18l-6-4-6 4z"/>'};
P.headphones='<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="13" width="5" height="8" rx="2"/><rect x="16" y="13" width="5" height="8" rx="2"/>';P.pause='<rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/>';
P.mic='<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>';P.zoom='<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11h6M11 8v6"/>';
const ic=n=>'<svg class="ic" viewBox="0 0 24 24">'+P[n]+'</svg>';
/* دائرة تقدّم بلون الثيم وحده. txt اختياري (مثل عدد بدل النسبة) */
const ring=(p,o,txt)=>{p=Math.max(0,Math.min(100,Math.round(p||0)));o=o||'';return '<span class="rg '+o+'"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16"/>'+(p>0?'<circle class="v" cx="20" cy="20" r="16" pathLength="100" stroke-dasharray="'+p+' 100"/>':'')+'</svg><em>'+(txt!=null?txt:ar(p)+'٪')+'</em></span>'};
const lp1=l=>l.dur?Math.min(100,Math.round(l.pos/l.dur*100)):0,gp=a=>a.length?Math.round(a.reduce((s,l)=>s+lp1(l),0)/a.length):0;
const mono=n=>{const c=skey(n);const s=c&&/^[a-z]{2,5}\d{3,4}$/.test(c.k)?c.n.replace(/\d+$/,'').slice(0,2):(Array.from(String(n).trim())[0]||'؟');return s.toUpperCase()};
/* أذكار الترويسة: ذكر مختلف عند كل فتح للرئيسية، ويتبدّل كل دقيقة */
const ZK=['سبحان الله وبحمده','لا حول ولا قوة إلا بالله','الله أكبر','لا تجعل الدنيا تلهيك عن ذكر الله','أستغفر الله وأتوب إليه','لا إله إلا الله'];
let zi=Math.floor(Math.random()*ZK.length);
setInterval(()=>{const e=$('#dk');if(!e)return;zi=(zi+1)%ZK.length;const n=document.createElement('b');n.id='dk';n.textContent=ZK[zi];e.replaceWith(n)},60000);

/* ---------- التخزين ---------- */
const K='mrj_v1';let D;
function load(){let o=null;try{o=JSON.parse(localStorage.getItem(K))}catch(e){}
 D=o&&typeof o==='object'?o:{};D.v=1;D.lessons=D.lessons||[];D.lists=D.lists||[];D.moments=D.moments||[];
 D.settings=Object.assign({dir:'before',theme:'auto',pal:'olive',lite:false,font:'plex',mtn:{},cap:45,back:5,margin:3,pause:true,lang:'ar-SA',later:false,model:'gemini-flash-latest',gkey:'',rng:0},D.settings||{});
 D.usage=D.usage||{m:'',n:0};}
function save(q){if(!q){D.mt=Date.now();schedPush()}try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){toast('تعذّر الحفظ: مساحة التخزين ممتلئة');return false}}
const idbo=()=>new Promise((r,j)=>{const q=indexedDB.open('mrj',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function idb(m,k,v){const d=await idbo();return new Promise((r,j)=>{const t=d.transaction('f',m==='get'?'readonly':'readwrite'),s=t.objectStore('f'),q=m==='put'?s.put(v,k):m==='get'?s.get(k):s.delete(k);t.oncomplete=()=>r(q.result);t.onerror=()=>j(t.error);t.onabort=()=>j(t.error)})}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const S=()=>D.settings;
const BLUR_OK=(()=>{try{return CSS.supports('backdrop-filter','blur(1px)')||CSS.supports('-webkit-backdrop-filter','blur(1px)')}catch(e){return true}})();
function applyTheme(){const d=document.documentElement;try{applyFont();applyMT()}catch(e){}d.dataset.theme=S().theme;d.dataset.pal=S().pal||'olive';d.dataset.glass=(S().lite||!BLUR_OK)?'lite':'full';const m=document.querySelector('meta[name=theme-color]');if(m)requestAnimationFrame(()=>{m.content=getComputedStyle(d).getPropertyValue('--bg').trim()||m.content})}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(typeof D!=='undefined'&&D&&S().theme==='auto')applyTheme()})}catch(e){}

/* ---------- واجهة مساعدة ---------- */
let sTimer;
function toast(m){inFS()?ftoast(m):snack(m)}
function snack(m,undo){const e=$('#snack');e.querySelector('span').textContent=m;const b=e.querySelector('button');b.style.display=undo?'':'none';b.onclick=()=>{clearTimeout(sTimer);e.classList.remove('on');undo&&undo()};e.classList.add('on');clearTimeout(sTimer);sTimer=setTimeout(()=>e.classList.remove('on'),undo?5000:3200)}
function dlg(o){const e=document.createElement('div');e.className='ov'+(o.sheet?' sheet':'');
 e.innerHTML='<div class="dl card" role="dialog">'+(o.t?'<h3>'+o.t+'</h3>':'')+(o.p?'<p class="mu">'+o.p+'</p>':'')+(o.inp!==undefined?'<input class="in" id="di" value="'+esc(o.inp)+'" placeholder="'+esc(o.ph||'')+'">':'')+'<div class="bs">'+o.b.map((b,i)=>'<button class="btn '+(b.c===undefined?'sec':b.c)+'" data-i="'+i+'">'+b.t+'</button>').join('')+'</div></div>';
 e.onclick=ev=>{const bt=ev.target.closest('[data-i]');if(bt){const v=e.querySelector('#di');const val=v?v.value:'';e.remove();const b=o.b[bt.dataset.i];b.f&&b.f(val)}else if(ev.target===e)e.remove()};
 document.body.append(e);const i=e.querySelector('#di');i&&i.focus()}
const empty=(i,t,b)=>'<div class="card empty"><div class="ib">'+ic(i)+'</div><p class="mu">'+t+'</p>'+(b||'')+'</div>';
const fmtT=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,p=n=>String(n).padStart(2,'0');return ((h?h+':':'')+p(m)+':'+p(c)).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])};

/* ---------- التنقل ---------- */
let cur='home',curX=null;
function show(n,x){if(n!=='lesson')stopP();tmSet(n);cur=n;curX=x||null;document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==='s-'+n));
 $('#nav').style.display='';const NT={home:'home',add:'home',review:'home',lessons:'lessons',lesson:'lessons'};
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===NT[n]));
 render(n);scrollTo(0,0)}
function go(n,x){if(n==='home'||n==='lessons')history.replaceState({s:n},'');else history.pushState({s:n,x:x||null},'');show(n,x)}
let fsBack=false;
addEventListener('popstate',e=>{if(fsBack){fsBack=false;return}if(inFS()){fsOff();return}const s=e.state||{s:'home'};show(s.s,s.x)});
function render(n){({home:rHome,lessons:rLessons,add:rAdd,settings:rSet,lesson:rLesson,review:rReview,sheet:rSheet})[n||cur]()}

/* ---------- الرئيسية ---------- */
const PDF_ON=false; /* خانة PDF مخفية مؤقتاً حتى تطويرها. غيّرها إلى true لإعادتها */
const TYPES={yt:['yt','رابط يوتيوب','فيديو واحد'],pl:['list','قائمة تشغيل','كل دروسها دفعة واحدة'],file:['film','فيديو أو صوت','من جهازك'],pdf:['pdf','ملف PDF','من جهازك']};
const FONTS=[['plex','IBM Plex Sans Arabic','IBM+Plex+Sans+Arabic:wght@400;500;600','بلكس (الأصلي)'],['tajawal','Tajawal','Tajawal:wght@400;500;700','تجوّل'],['cairo','Cairo','Cairo:wght@400;500;700','القاهرة'],['almarai','Almarai','Almarai:wght@400;700','المرعي'],['kufi','Noto Kufi Arabic','Noto+Kufi+Arabic:wght@400;500;600','كوفي'],['naskh','Noto Naskh Arabic','Noto+Naskh+Arabic:wght@400;500;600','نسخ'],['amiri','Amiri','Amiri:wght@400;700','أميري']];
const FL=new Set();
function loadFonts(ids){const q=FONTS.filter(f=>ids.includes(f[0])&&f[0]!=='plex').map(f=>'family='+f[2]).join('&');if(!q||FL.has(q))return;FL.add(q);const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+q+'&display=swap';document.head.append(l)}
function applyFont(){const f=FONTS.find(x=>x[0]===S().font)||FONTS[0];loadFonts([f[0]]);document.documentElement.style.setProperty('--ff',"'"+f[1]+"'")}
const PALS=[['olive','زيتوني','#5A7A40','#8FA66B'],['sea','بحري','#3F7F9A','#7FB4CC'],['sand','رملي','#A8703A','#D1A06A'],['berry','توتي','#A85A6B','#D68B9C'],['lav','لافندر','#6F5FA8','#A99BDB']];
const MT={imp:['مهم','--c-imp'],law:['قانون','--c-law'],how:['طريقة حل','--c-how'],dnu:['لم أفهم','--c-dnu'],note:['ملاحظة','--c-note']};
/* أسماء أزرار اللحظات قابلة للتعديل من الإعدادات وتنطبق على كل التطبيق */
const MT0=Object.fromEntries(Object.entries(MT).map(([k,v])=>[k,v[0]]));
function applyMT(){const n=(typeof D!=='undefined'&&D&&D.settings&&D.settings.mtn)||{};Object.keys(MT).forEach(k=>{MT[k][0]=n[k]||MT0[k]})}
function rHome(){
 const last=[...D.lessons].filter(l=>l.opened).sort((a,b)=>b.opened-a.opened)[0];
 zi=(zi+1)%ZK.length;let h='<div class="hd"><div class="t"><small>ذكر</small><b id="dk">'+ZK[zi]+'</b></div><button class="ibt" data-a="settings" aria-label="الإعدادات">'+ic('set')+'</button></div>';
 if(last){const p=last.dur?Math.min(100,Math.round(last.pos/last.dur*100)):0;
  h+='<div class="hero" style="margin-top:12px"><div class="gr"><small>تابع من حيث وقفت</small><h3 style="margin:2px 0 4px">'+esc(last.title)+'</h3><small>'+ar(mc(last.id))+' لحظة</small></div>'+ring(p,'big')+'<button class="pl" data-a="open" data-id="'+last.id+'" aria-label="متابعة">'+ic('play')+'</button></div>'}
 const dn=dueList().length,tot=D.moments.filter(m=>m.type!=='note').length;if(tot)h+='<button class="card row" style="width:100%;text-align:right;margin-top:14px" data-a="rev">'+ring(dn/tot*100,'',ar(dn))+'<div class="gr"><b>المراجعة</b><br><small>'+(dn?ar(dn)+' لحظة تنتظرك':'لا شيء للمراجعة الآن')+'</small></div></button>';
 h+='<h2>إضافة درس</h2><div class="grid">'+Object.keys(TYPES).filter(k=>k!=='pdf'||PDF_ON).map(k=>'<button class="card tile" data-a="addt" data-t="'+k+'"><span class="ib">'+ic(TYPES[k][0])+'</span><b>'+TYPES[k][1]+'</b><small>'+TYPES[k][2]+'</small></button>').join('')+'</div>';
 h+='<h2>آخر لحظاتك</h2>';
 const ms=[...D.moments].sort((a,b)=>b.t-a.t).slice(0,5).filter(m=>D.lessons.some(l=>l.id===m.lesson));
 h+=ms.length?'<div class="stk">'+ms.map(m=>{const l=D.lessons.find(x=>x.id===m.lesson),t=MT[m.type]||MT.note;return '<button class="card row" style="text-align:right;width:100%" data-a="open" data-id="'+l.id+'"><span class="dot" style="background:var('+t[1]+')"></span><div class="gr"><b>'+esc(m.name||t[0])+'</b><br><small>'+esc(l.title)+' · '+(l.type==='pdf'?'صفحة '+ar(m.pos):'من الدقيقة '+fp(m))+'</small></div></button>'}).join('')+'</div>'
  :empty('moment','لحظاتك المهمة ستظهر هنا بعد أن تبدأ درسك الأول');
 $('#s-home').innerHTML=h}
